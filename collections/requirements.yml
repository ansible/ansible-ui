---
# Collections with known deprecations for testing
# These will generate deprecation warnings when using deprecated features

collections:
  # Community.General has many deprecations
  - name: community.general
    version: ">=8.0.0"

  # Community.Crypto has deprecations
  - name: community.crypto
    version: ">=2.0.0"

  # Amazon AWS modules have deprecations
  - name: amazon.aws
    version: ">=7.0.0"

  # Ansible.Posix has some deprecations
  - name: ansible.posix
    version: ">=1.5.0"

  # Community.Docker has deprecations
  - name: community.docker
    version: ">=3.0.0"

  # Community.MySQL has deprecations
  - name: community.mysql
    version: ">=3.0.0"
