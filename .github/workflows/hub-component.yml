name: HUB Component

on:
  pull_request:
    paths:
      - 'cypress/support/**'
      - 'frontend/hub/**'
      - 'frontend/common/**'
      - 'framework/**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  awx:
    name: HUB
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/hub
