name: Nightly Playwright Browsers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1-5'

jobs:
  platform-ui-image:
    name: Platform UI Image
    uses: ./.github/workflows/image.yml
    with:
      build-directory: platform
      build-script: build
      docker-file: platform/Dockerfile
      docker-target: platform-ui
      docker-image: platform-ui
      upload-artifact: true

  playwright:
    name: Playwright
    needs:
      - platform-ui-image
    uses: ./.github/workflows/playwright.yml
    strategy:
      fail-fast: false
      matrix:
        project: 
          - "chromium"
          - "firefox"
          - "webkit"
    with:
      PROJECT: mock ${{ matrix.project }}
      BROWSER: ${{ matrix.project }}
      SLACK_NOTIFICATION: true
    