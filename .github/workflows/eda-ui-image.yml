name: EDA UI Image

on:
  push:
    tags:
      - '*'

jobs:
  eda-ui-image:
    name: Build and Push EDA UI Image
    if: github.repository == 'ansible/aap-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: NPM Build
        run: npm run build:eda

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME=$(echo "${GITHUB_REF#refs/tags/}")
          echo "Tag name: $TAG_NAME"
          
          # Assuming tags are in the format vX.Y.Z[-pre-release]
          MAJOR=$(echo "$TAG_NAME" | cut -d. -f1 | sed 's/v//')
          MINOR=$(echo "$TAG_NAME" | cut -d. -f2)
          PATCH=$(echo "$TAG_NAME" | cut -d. -f3 | cut -d'-' -f1)
          
          echo "Major version: $MAJOR"
          echo "Minor version: $MINOR"
          echo "Patch version: $PATCH"
          
          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV
          echo "PATCH=$PATCH" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: quay.io/ansible/eda-ui
          tags: |
            type=raw,value=${{ env.MAJOR }}.${{ env.MINOR }}
            type=raw,value=${{ env.MAJOR }}.${{ env.MINOR }}.${{ env.PATCH }}
            type=raw,value=main,enable=${{ startsWith(github.ref, 'refs/tags/v1.0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v1.0.') }}

      - name: Docker Build and Push EDA UI Image
        uses: docker/build-push-action@v4
        with:
          context: .
          target: eda-ui
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
