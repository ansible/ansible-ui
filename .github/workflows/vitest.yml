name: Vitest

on:
  workflow_call:
    inputs:
      directory:
        description: 'The workspace directory to run vitest in'
        required: true
        type: string
      artifact-prefix:
        description: 'Prefix for coverage artifact names (to avoid collisions)'
        type: string
        required: false
        default: ''
      coverage:
        description: 'Whether to run with coverage enabled'
        type: boolean
        required: false
        default: false

jobs:
  generate-matrix:
    name: Generate Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.MATRIX }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate matrix
        id: set-matrix
        run: |
          BASE_DIR="${{ inputs.directory }}"
          matrix=$(find "$BASE_DIR" -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -exec dirname {} \; | sed "s|^$BASE_DIR/||" | awk -F'/' '{print $1}' | sort -u | jq -R . | jq -s -c .)
          echo "Matrix value: $matrix"
          echo "MATRIX=$matrix" >> $GITHUB_OUTPUT

  vitest:
    name: ${{ matrix.subdirectory }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix:
        subdirectory: ${{ fromJson(needs.generate-matrix.outputs.MATRIX) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ./node_modules
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run vitest
        working-directory: ${{ inputs.directory }}
        run: npx vitest run ${{ inputs.coverage && '--coverage' || '' }} ${{ matrix.subdirectory }}
      - name: Upload coverage artifact
        if: ${{ inputs.coverage && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage-${{ inputs['artifact-prefix'] && format('{0}-', inputs['artifact-prefix']) || '' }}${{ matrix.subdirectory }}
          path: ${{ inputs.directory }}/coverage/vitest/coverage-final.json
          retention-days: 7
          if-no-files-found: ignore
