name: UI E2E Image

on:
  push:
    branches:
      - main
      - release/*
    tags:
      - '*'

jobs:
  ui-e2e-image:
    name: Build and Push UI E2E Image
    if: github.repository == 'ansible/aap-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME=$(echo "${GITHUB_REF#refs/tags/}")
          echo "Tag name: $TAG_NAME"
          
          # Assuming tags are in the format vX.Y.Z[-pre-release]
          MAJOR=$(echo "$TAG_NAME" | cut -d. -f1 | sed 's/v//')
          MINOR=$(echo "$TAG_NAME" | cut -d. -f2)
          PATCH=$(echo "$TAG_NAME" | cut -d. -f3 | cut -d'-' -f1)
          
          echo "Major version: $MAJOR"
          echo "Minor version: $MINOR"
          echo "Patch version: $PATCH"
          
          echo "MAJOR=$MAJOR" >> $GITHUB_ENV
          echo "MINOR=$MINOR" >> $GITHUB_ENV
          echo "PATCH=$PATCH" >> $GITHUB_ENV
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/ansible/ui-e2e
          tags: |
            type=semver,value=${{ env.MAJOR }}
            type=semver,value=${{ env.MAJOR }}.${{ env.MINOR }}
            type=raw,value={{branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker Build and Push EDA UI Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui-e2e
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
