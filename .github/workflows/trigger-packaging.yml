# When packaging repo secrets are set, sends repository_dispatch to the repo.
#
# Uses actions/github-script (GitHub-maintained) → REST API:
# https://docs.github.com/en/rest/repos/repos#create-a-repository-dispatch-event
#
# Repository secret:
#   PACKAGING_GITHUB_REPOSITORY — packaging repository slug (owner/name)
#
# Uses the existing Ansible CICD App ID variable and private-key secret. The App
# installation must include PACKAGING_GITHUB_REPOSITORY. The workflow requests a
# Contents: write token only for that repository when App dispatch is enabled.

name: Trigger packaging builds

on:
  push:
    branches:
      - main
      - devel
    tags:
      - '*'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Secrets cannot be used in step `if:`, so gate via env + output (no secret values written to logs).
      - name: Check packaging dispatch configuration
        id: gate
        env:
          PACKAGING_REPO: ${{ secrets.PACKAGING_GITHUB_REPOSITORY }}
          USE_GITHUB_APP: ${{ vars.PACKAGING_DISPATCH_USE_GITHUB_APP }}
        run: |
          if [ "$USE_GITHUB_APP" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo '::notice::Packaging dispatch is disabled until PACKAGING_DISPATCH_USE_GITHUB_APP=true.'
          elif [ -z "$PACKAGING_REPO" ]; then
            echo "::error::PACKAGING_GITHUB_REPOSITORY is required for App dispatch."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Identify packaging repository
        if: steps.gate.outputs.enabled == 'true'
        id: packaging
        env:
          PACKAGING_REPO: ${{ secrets.PACKAGING_GITHUB_REPOSITORY }}
        run: |
          if [[ ! "$PACKAGING_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::PACKAGING_GITHUB_REPOSITORY must be owner/repo"
            exit 1
          fi
          owner="${PACKAGING_REPO%/*}"
          repo="${PACKAGING_REPO#*/}"
          printf '::add-mask::%s\n' "$owner" "$repo"
          printf 'owner=%s\nrepo=%s\n' "$owner" "$repo" >> "$GITHUB_OUTPUT"

      - name: Verify packaging token scope
        if: steps.gate.outputs.enabled == 'true'
        env:
          PACKAGING_OWNER: ${{ steps.packaging.outputs.owner }}
          PACKAGING_NAME: ${{ steps.packaging.outputs.repo }}
        run: |
          if [ -z "$PACKAGING_OWNER" ] || [ -z "$PACKAGING_NAME" ]; then
            echo "::error::Cannot scope packaging token without an owner and repository."
            exit 1
          fi

      - name: Create packaging dispatch token
        if: steps.gate.outputs.enabled == 'true'
        id: packaging_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.ANSIBLE_CICD_BOT_ORG_RW_TOKEN_APP_ID }}
          private-key: ${{ secrets.ANSIBLE_CICD_BOT_ORG_RW_TOKEN_PRIVATE_KEY }}
          owner: ${{ steps.packaging.outputs.owner }}
          repositories: ${{ steps.packaging.outputs.repo }}
          permission-contents: write

      - name: Verify packaging app token
        if: steps.gate.outputs.enabled == 'true'
        env:
          PACKAGING_APP_TOKEN: ${{ steps.packaging_app.outputs.token }}
        run: |
          if [ -z "$PACKAGING_APP_TOKEN" ]; then
            echo "::error::The packaging app did not issue a dispatch token."
            exit 1
          fi

      - uses: actions/github-script@v7
        if: steps.gate.outputs.enabled == 'true'
        env:
          PACKAGING_REPO: ${{ secrets.PACKAGING_GITHUB_REPOSITORY }}
        with:
          github-token: ${{ steps.packaging_app.outputs.token }}
          script: |
            const slug = process.env.PACKAGING_REPO;
            if (!slug || !slug.includes('/')) {
              core.setFailed('PACKAGING_GITHUB_REPOSITORY must be owner/repo');
              return;
            }
            const i = slug.indexOf('/');
            const owner = slug.slice(0, i);
            const repo = slug.slice(i + 1);
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'build-images',
              client_payload: {
                ref: context.ref,
                sha: context.sha,
                repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            });
