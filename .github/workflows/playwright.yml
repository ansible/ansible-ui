name: Playwright

on:
  workflow_call:
    inputs:
      PLATFORM_UI:
        type: string
        required: false
      TAGS: 
        type: string
        required: false
      NOT_TAGS: 
        type: string
        required: false
      PARALLEL_TESTS:
        type: number
        required: false
        default: 2
      PROJECT:
        type: string
        default: "mock chromium"
      SLACK_NOTIFICATION:
        type: boolean
        required: false
        default: false
      BROWSER:
        type: string
        required: false
        default: chromium
    secrets:
      SLACK_WEBHOOK_URL:
        required: false

jobs:
  matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      shardIndex: ${{ steps.matrix.outputs.shardIndex }}
      shardTotal: ${{ steps.matrix.outputs.shardTotal }}
    steps:
      - id: matrix
        run: |
          echo "shardIndex=${{ format('[1, {0}]', inputs.PARALLEL_TESTS) }}" >> $GITHUB_OUTPUT
          echo "shardTotal=${{ format('[{0}]', inputs.PARALLEL_TESTS) }}" >> $GITHUB_OUTPUT

  playwright:
    name: Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ fromJSON(needs.matrix.outputs.shardIndex) }}
        shardTotal: ${{ fromJSON(needs.matrix.outputs.shardTotal) }}

    steps:
    - name: Download image
      if: ${{ inputs.PLATFORM_UI == '' }}
      uses: actions/download-artifact@v4
      with:
        name: platform-ui.tar

    - name: Load image
      if: ${{ inputs.PLATFORM_UI == '' }}
      run: docker load --input platform-ui.tar

    - name: Run container
      if: ${{ inputs.PLATFORM_UI == '' }}
      run: docker run -d --name platform-ui -p 4100:443 -e PLATFORM_SERVER=http://localhost platform-ui

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: PreCache
      run: npm version 0.0.0 --no-git-tag-version

    - name: Cache dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ./node_modules
          /home/runner/.cache/Cypress
        key: modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ inputs.BROWSER }}

    - name: Run Playwright tests
      working-directory: playwright
      run: npx playwright test --project="${{ inputs.PROJECT }}" --project="global setup" --reporter=blob --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      env:
        PLATFORM_UI: ${{ inputs.PLATFORM_UI }}
        PLATFORM_USERNAME: mock
        PLATFORM_PASSWORD: mock
        TAGS: ${{ inputs.TAGS }}
        NOT_TAGS: ${{ inputs.NOT_TAGS }}
        AWX_API_PREFIX: '/api/controller/v2'

    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.BROWSER }}-blob-report-${{ matrix.shardIndex }}
        path: playwright/blob-report
        retention-days: 1

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-${{ inputs.BROWSER }}-${{ matrix.shardIndex }}
        path: playwright/test-results
        retention-days: 1
        overwrite: true
        if-no-files-found: ignore

    - name: Stop container
      run: docker stop platform-ui

  playwright-report:
    name: Playwright Report
    if: ${{ !cancelled() }}
    needs: [playwright]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: PreCache
      run: npm version 0.0.0 --no-git-tag-version

    - name: Cache dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ./node_modules
          /home/runner/.cache/Cypress
        key: modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci

    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: ${{ inputs.BROWSER }}-blob-report-*
        merge-multiple: true

    - name: Merge into JUint Report
      run: npx playwright merge-reports --reporter junit ./all-blob-reports > ${{ inputs.BROWSER }}-junit.xml

    - name: Upload JUint report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.BROWSER }}-junit-report
        path: ${{ inputs.BROWSER }}-junit.xml
        retention-days: 1

    - name: Test Summary
      if: always()
      uses: test-summary/action@v2
      with:
        paths: ${{ inputs.BROWSER }}-junit.xml

  slack-success-notification:
    name: Slack Success Notification
    if: ${{ inputs.SLACK_NOTIFICATION == true && success() }}
    runs-on: ubuntu-latest
    needs: playwright
    steps:
    - name: Slack Success Notification
      if: ${{ inputs.SLACK_NOTIFICATION == true && success() }}
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":playwright: *Playwright* `${{ inputs.PROJECT }}`: :done-circle-check: *<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Success>*"
                }
              }
            ]
          }      
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  slack-failure-notification:
    name: Slack Failure Notification
    if: ${{ inputs.SLACK_NOTIFICATION == true && failure() }}
    runs-on: ubuntu-latest
    needs: playwright
    steps:
    - name: Slack Success Notification
      if: ${{ inputs.SLACK_NOTIFICATION == true && success() }}
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ":playwright: *Playwright* `${{ inputs.PROJECT }}`: :failed: *<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Failure>*"
                }
              }
            ]
          }      
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
