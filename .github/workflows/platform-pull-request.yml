name: Platform PR

on:
  pull_request:

env:
  IS_GITHUB_ACTION: true

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  # pr-queue:
  #   name: PR Queue
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: ahmadnassri/action-workflow-queue@v1
  #       with:
  #         delay: 60000
  #         timeout: 28800000

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Checks
        run: npm run checks

  platform-ui-image:
    name: Platform UI Image
    needs:
      - packages
    uses: ./.github/workflows/image.yml
    with:
      build-directory: platform
      build-script: build
      docker-file: platform/Dockerfile
      docker-target: platform-ui
      docker-image: platform-ui
      upload-artifact: true
      
  playwright:
    name: Playwright
    needs:
      - platform-ui-image
    uses: ./.github/workflows/playwright.yml

  awx-component:
    name: AWX Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/awx

  eda-component:
    name: EDA Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/eda

  hub-component:
    name: HUB Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/hub

  common-component:
    name: Common Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/common

  framework-component:
    name: Framework Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: framework

  platform-component:
    name: Platform Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: platform

  # cleanup:
  #   name: Cleanup
  #   needs:
  #     - pr-queue
  #   uses: ./.github/workflows/cleanup.yml
  #   with:
  #     PLATFORM_SERVER: ${{ vars.PLATFORM_SERVER }}
  #   secrets:
  #     PLATFORM_PASSWORD: ${{ secrets.PLATFORM_PASSWORD }}

  # platform-e2e:
  #   name: Platform E2E
  #   needs:
  #     - packages
  #     - cleanup
  #     - image
  #   uses: ./.github/workflows/e2e.yml
  #   with:
  #     PLATFORM_SERVER: ${{ vars.PLATFORM_SERVER }}
  #     PARALLEL_TESTS: 16
  #   secrets:
  #     PLATFORM_PASSWORD: ${{ secrets.PLATFORM_PASSWORD }}
  #     PLATFORM_PROJECT_ID: ${{ secrets.PLATFORM_PROJECT_ID }}
  #     PLATFORM_RECORD_KEY: ${{ secrets.PLATFORM_RECORD_KEY }}

  success:
    name: Success
    runs-on: ubuntu-latest
    needs:
        - checks
        - playwright
        - awx-component
        - eda-component
        - hub-component
        - common-component
        - framework-component
        - platform-component
        # - platform-e2e
    if: ${{ always() }}
    steps:
      - name: Success Check
        if: ${{ needs.checks.result == 'success' &&
                needs.playwright.result == 'success' &&
                needs.awx-component.result == 'success' &&
                needs.eda-component.result == 'success' &&
                needs.hub-component.result == 'success' &&
                needs.common-component.result == 'success' &&
                needs.framework-component.result == 'success' &&
                needs.platform-component.result == 'success' }}
        run: echo "All jobs succeeded"
      - name: Failure or Cancelled
        if: ${{ needs.checks.result != 'success' ||
                needs.playwright.result != 'success' ||
                needs.awx-component.result != 'success' ||
                needs.eda-component.result != 'success' ||
                needs.hub-component.result != 'success' ||
                needs.common-component.result != 'success' ||
                needs.framework-component.result != 'success' ||
                needs.platform-component.result != 'success' }}
        run: |
          echo playwright: ${{ needs.playwright.result }}
          exit 1