# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/

sonar.sources = framework/,frontend/,platform/
sonar.tests = playwright/
# Exclude generated code, API specs, and known debug/sample data
sonar.exclusions = **/*.fixture.ts,**/*.fixture.json,**/vite.config.ts,**/vite.chunkGroups.ts,**/interfaces/generated/**,**/interfaces/generated-from-swagger/**,**/swagger.json,**/openapi.json,**/package-lock.json,**/vitest.shared.ts
sonar.coverage.exclusions = **/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/vitest.*.ts,**/webpack.config.cjs,**/vite.config.ts,**/vite.chunkGroups.ts,**/interfaces/generated/**,**/interfaces/generated-from-swagger/**,**/swagger.json,**/openapi.json,**/package-lock.json,**/build.cjs
sonar.cpd.exclusions=framework/**/*,frontend/**/*,platform/**/*

sonar.javascript.lcov.reportPaths=./coverage/combined/lcov.info
sonar.typescript.lcov.reportPaths=./coverage/combined/lcov.info
