name: Nightly Component Tests Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

env:
  IS_GITHUB_ACTION: true

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Checks
        run: npm run checks

  awx-component:
    name: AWX Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/awx
      generate_junit_results: true

  eda-component:
    name: EDA Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/eda
      generate_junit_results: true


  hub-component:
    name: HUB Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/hub
      generate_junit_results: true

  common-component:
    name: Common Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/common
      generate_junit_results: true

  framework-component:
    name: Framework Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: framework
      generate_junit_results: true

  platform-component:
    name: Platform Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: platform
      generate_junit_results: true

  upload-test-results:
    name: Upload jUnit test results
    needs:
        - checks
        - awx-component
        - eda-component
        - hub-component
        - common-component
        - framework-component
        - platform-component
    uses: ./.github/workflows/junit-results.yml
    secrets:
      PDE_ORG_RESULTS_UPLOAD_PASSWORD: ${{ secrets.PDE_ORG_RESULTS_UPLOAD_PASSWORD }}
