---
# Production-style playbook with multiple collection deprecations
# This demonstrates what a customer's estate might look like
# Install collections first: ansible-galaxy collection install -r collections/requirements.yml

- name: Production Deprecation Warnings Demo
  hosts: localhost
  gather_facts: yes
  connection: local

  tasks:
    - name: Show environment
      debug:
        msg: "Testing on Ansible {{ ansible_version.full }}"

    # =========================================================================
    # Bare conditional deprecations (Core 2.16 → removed 2.19)
    # =========================================================================

    - name: Check if running on RedHat family
      debug:
        msg: "RedHat-based system"
      when: ansible_os_family
      tags: core

    - name: Check distribution
      debug:
        msg: "Distribution: {{ ansible_distribution }}"
      when: ansible_distribution
      tags: core

    - name: Check hostname
      debug:
        msg: "Hostname: {{ ansible_hostname }}"
      when: ansible_hostname
      tags: core

    - name: Check system type
      debug:
        msg: "System: {{ ansible_system }}"
      when: ansible_system
      tags: core

    - name: Check architecture
      debug:
        msg: "Arch: {{ ansible_architecture }}"
      when: ansible_architecture
      tags: core

    # =========================================================================
    # Community.General deprecated features
    # =========================================================================

    - name: Use deprecated git_config list_all (community.general)
      community.general.git_config:
        list_all: yes
      register: git_config_result
      ignore_errors: yes
      tags: community_general

    - name: Use deprecated iso_extract (community.general)
      community.general.iso_extract:
        image: /dev/null
        dest: /tmp
      ignore_errors: yes
      tags: community_general

    # =========================================================================
    # Community.Crypto deprecated features
    # =========================================================================

    - name: Use deprecated openssl_privatekey (community.crypto)
      community.crypto.openssl_privatekey:
        path: /tmp/test_key.pem
        size: 2048
      ignore_errors: yes
      tags: community_crypto

    # =========================================================================
    # Ansible.Posix deprecated patterns
    # =========================================================================

    - name: Use bare conditional with posix facts
      debug:
        msg: "User: {{ ansible_user_id }}"
      when: ansible_user_id
      tags: posix

    - name: Another posix bare conditional
      debug:
        msg: "Home: {{ ansible_env.HOME }}"
      when: ansible_env.HOME
      tags: posix

    # =========================================================================
    # Simulate multiple playbook runs (realistic for customers)
    # =========================================================================

    - name: Database server pattern (bare conditional)
      debug:
        msg: "This is a database server"
      when: ansible_hostname
      tags: database

    - name: Web server pattern (bare conditional)
      debug:
        msg: "This is a web server"
      when: ansible_fqdn
      tags: webserver

    - name: Cache server pattern (bare conditional)
      debug:
        msg: "This is a cache server"
      when: ansible_nodename
      tags: cache

    # =========================================================================
    # Loop patterns that appear in customer playbooks
    # =========================================================================

    - name: Service management (bare conditionals in loop)
      debug:
        msg: "Managing service: {{ item }}"
      when: item
      loop:
        - httpd
        - nginx
        - postgresql
        - redis
        - memcached
      tags: services

    - name: Package verification (bare conditionals)
      debug:
        msg: "Verifying package: {{ item }}"
      when: item
      loop:
        - python3
        - git
        - curl
        - wget
        - vim
      tags: packages

    # =========================================================================
    # Multiple environments (typical customer scenario)
    # =========================================================================

    - name: Production environment check
      debug:
        msg: "Production environment"
      when: ansible_kernel
      tags: production

    - name: Staging environment check
      debug:
        msg: "Staging environment"
      when: ansible_machine
      tags: staging

    - name: Development environment check
      debug:
        msg: "Development environment"
      when: ansible_python_version
      tags: development

    - name: Summary
      debug:
        msg: |
          Deprecation test complete!
          This playbook simulates a production environment with multiple
          deprecated patterns that customers would encounter.
          Check Administration → Deprecations for results.
