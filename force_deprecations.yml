---
- name: Force Deprecations on Core 2.16
  hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    test_var: "{{ lookup('env', 'HOME') }}"

  tasks:
    - name: Show Ansible version
      debug:
        msg: "Ansible version: {{ ansible_version.full }}"

    - name: Test 1 - Loop squashing (deprecated in 2.11, warns in 2.16)
      yum:
        name: "{{ item }}"
        state: present
      loop:
        - httpd
        - nginx
      when: false  # Don't actually install
      ignore_errors: yes

    - name: Test 2 - Jinja2 comparisons (various deprecations)
      debug:
        msg: "{{ 'test' if ansible_distribution == 'CentOS' else 'other' }}"
      when: ansible_distribution is defined

    - name: Test 3 - Using 'include' (deprecated since 2.8)
      debug:
        msg: "Checking if include_tasks triggers warnings"

    # Most reliable deprecation trigger for 2.16
    - name: Test 4 - Check deprecation warnings config
      shell: |
        ansible-playbook --version
        echo "---" > /tmp/test_dep.yml
        echo "- hosts: localhost" >> /tmp/test_dep.yml
        echo "  gather_facts: no" >> /tmp/test_dep.yml
        echo "  tasks:" >> /tmp/test_dep.yml
        echo "    - debug: msg=test" >> /tmp/test_dep.yml
        echo "      when: true" >> /tmp/test_dep.yml
        ansible-playbook /tmp/test_dep.yml -v
      register: version_check
      changed_when: false

    - name: Show version output
      debug:
        var: version_check.stdout_lines
