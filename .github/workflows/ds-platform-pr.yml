name: Platform PR

on:
  pull_request:

env:
  IS_GITHUB_ACTION: true

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  pr-queue:
    name: PR Queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ahmadnassri/action-workflow-queue@v1
        with: 
          delay: 60000
          timeout: 28800000

  checks:
    name: Checks
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Checks
        run: npm run checks

  awx-component:
    name: AWX Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/awx

  eda-component:
    name: EDA Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/eda

  hub-component:
    name: HUB Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/hub

  common-component:
    name: Common Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: frontend/common

  framework-component:
    name: Framework Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: framework

  platform-component:
    name: Platform Component
    needs: packages
    uses: ./.github/workflows/component.yml
    with:
      directory: platform

  platform-e2e:
    name: Platform E2E
    needs:
      - packages
      - pr-queue
    uses: ./.github/workflows/ds-platform-e2e.yml
    with:
      PLATFORM_SERVER: ${{ vars.PLATFORM_SERVER }}
    secrets:
      PLATFORM_PASSWORD: ${{ secrets.PLATFORM_PASSWORD }}
      PLATFORM_PROJECT_ID: ${{ secrets.PLATFORM_PROJECT_ID }}
      PLATFORM_RECORD_KEY: ${{ secrets.PLATFORM_RECORD_KEY }}

  success:
    name: Success
    runs-on: ubuntu-latest
    if: ${{ success() }}
    needs: 
      - checks
      - awx-component
      - eda-component
      - hub-component
      - common-component
      - framework-component
      - platform-component
      - platform-e2e
    steps:
      - run: echo Success
