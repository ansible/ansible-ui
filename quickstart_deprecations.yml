---
# Quick Deprecation Test for Ansible Core 2.16
# Minimal playbook to generate deprecation events in AWX/AAP
# Use this to quickly test the Deprecations Dashboard

- name: Quick Deprecation Test
  hosts: localhost
  gather_facts: yes
  connection: local

  tasks:
    - name: Show Ansible version
      debug:
        msg: "Ansible {{ ansible_version.full }}"

    # These bare conditionals trigger deprecation events
    # (scheduled for removal in Ansible 2.19)

    - name: Deprecation 1
      debug:
        msg: "Running on {{ ansible_distribution }}"
      when: ansible_distribution

    - name: Deprecation 2
      debug:
        msg: "OS Family: {{ ansible_os_family }}"
      when: ansible_os_family

    - name: Deprecation 3
      debug:
        msg: "Hostname: {{ ansible_hostname }}"
      when: ansible_hostname

    - name: Deprecation 4
      debug:
        msg: "System: {{ ansible_system }}"
      when: ansible_system

    - name: Deprecation 5
      debug:
        msg: "Architecture: {{ ansible_architecture }}"
      when: ansible_architecture

    - name: Complete
      debug:
        msg: "Test complete! Check Administration → Deprecations"
