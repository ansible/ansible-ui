name: Run E2E

on:
  workflow_dispatch:
    inputs:
      PLATFORM_SERVER:
        type: string
        required: true
        description: 'Platform Server'
      PARALLEL_TESTS:
        description: 'Number of parallel test runners'
        type: string
        required: true
        default: '16'

jobs:
  platform-ui-image:
    name: Platform UI Image
    uses: ./.github/workflows/image.yml
    with:
      build-directory: platform
      build-script: build
      docker-context: platform
      docker-file: _packaging/docker/platform/Dockerfile
      docker-target: platform-ui
      docker-image: platform-ui
      upload-artifact: true
    secrets: inherit

  platform-e2e:
    name: Platform E2E
    needs:
      - platform-ui-image
    uses: ./.github/workflows/e2e.yml
    with:
      PLATFORM_SERVER: ${{ inputs.PLATFORM_SERVER }}
      PARALLEL_TESTS: ${{ inputs.PARALLEL_TESTS }}
    secrets: inherit