name: 'Add backported-* labels'

on:
  push:
    branches: [ 'release/2.5' ]

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
    - name: 'Set $LABEL from branch name'
      run: |
        LABEL="backported-2.5"
        echo "LABEL=${LABEL}" >> $GITHUB_ENV

    - uses: actions/checkout@v4

    # Expects merge commits to look like "*PR title (#original_pr_number) (#backport_pr_number)"
    - name: 'Set $PR to PR number'
      run: |
        git log -1 --oneline
        echo PR=`git log -1 --oneline | perl -ne 'print if s/^.*?\(#(\d+)\).*\(#\d+\).*$/$1/'` >> $GITHUB_ENV

    - name: "Add ${{ env.LABEL }} to #${{ env.PR }}"
      if: ${{ env.PR }}
      uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: ${{ env.LABEL }}
        number: ${{ env.PR }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
