version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # "increase" is required for npm workspaces monorepos. Without it, Dependabot skips
    # updating workspace package.json files when the existing range (e.g. ^1.0.0) already
    # satisfies the new version — so no PR is created. See: https://github.com/dependabot/dependabot-core/issues/5226
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      # Batches all non-major dependency updates into single PRs (one for
      # development, one for production). Major bumps and packages listed in
      # exclude-patterns still get individual PRs.
      non-major-dev:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'prettier'
          - '@playwright/test'
          - 'typescript'
          - 'vite'
          - 'webpack'
      non-major-prod:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - '@patternfly/*'
