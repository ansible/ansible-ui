name: Image

on:
  workflow_call:
    inputs:
      build-directory:
        description: 'Build Directory'
        type: string
        default: '.'
      build-script:
        description: 'Build Script'
        type: string
      docker-context:
        description: 'Docker Context'
        type: string
        default: '.'
      docker-image:
        description: 'Docker Image'
        type: string
        required: true
      docker-file:
        description: 'Dockerfile'
        type: string
        default: Dockerfile
      docker-target:
        description: 'Docker Target'
        type: string
      docker-publish:
        description: 'Docker Publish Image'
        type: boolean
        default: false
      upload-artifact:
        description: 'Upload Image as Artifact'
        type: boolean
        default: false
    secrets:
      QUAY_USERNAME:
        required: false
      QUAY_TOKEN:
        required: false

jobs:
  image:
    name: Image
    if: github.repository == 'ansible/aap-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install build dependencies
        run: npm i @rollup/rollup-linux-x64-gnu

      - name: NPM Build
        if: ${{ inputs.build-script }}
        working-directory: ${{ inputs.build-directory }}
        run: npm run ${{ inputs.build-script }}
        env:
          AWX_API_PREFIX: '/api/controller/v2'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        if: ${{ inputs.docker-publish }}
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Extract metadata (tags, labels) for Image
        if: ${{ inputs.docker-publish }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.docker-image }}
          tags: |
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=raw,value={{branch}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Image
        if: ${{ inputs.docker-publish }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file }}
          target: ${{ inputs.docker-target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and Load Image
        if: ${{ inputs.upload-artifact }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file }}
          target: ${{ inputs.docker-target }}
          platforms: linux/amd64
          tags: ${{ inputs.docker-image }}:latest
          load: true
  
      - name: Save Image
        if: ${{ inputs.upload-artifact }}
        run: docker save ${{ inputs.docker-image }} > ${{ inputs.docker-image }}.tar

      - name: Upload Image
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.docker-image }}.tar
          path: ${{ inputs.docker-image }}.tar
