<!doctype html>
<html>
  <head>
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
  </head>
  <body>
    <header>
      <h1>{{ site.title }}</h1>
      <form id="search-form" action="/">
        <input type="search" name="q" id="search-input" placeholder="Search..." />
        <input type="submit" value="Search" />
      </form>
    </header>

    <main>
      {{ content }}
      <div id="search-results"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jekyll-search@2.4.0/dist/jekyll-search.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var options = {
          inputSelector: '#search-input',
          searchIndex: '{{ '/search.json' | relative_url }}',
          resultsContainerSelector: '#search-results',
          placeholder: 'Search...',
        };
        new JekyllSearch(options);
      });
    </script>
  </body>
</html>
