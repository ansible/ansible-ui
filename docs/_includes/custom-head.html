<script src="https://cdn.jsdelivr.net/npm/mermaid@11.0.2/dist/mermaid.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async function () {
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
    });
    await mermaid.run({
      querySelector: '.language-mermaid',
    });
  });
</script>
