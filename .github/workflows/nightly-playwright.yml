name: Nightly Playwright

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  platform-ui-image:
    name: Platform UI Image
    uses: ./.github/workflows/image.yml
    with:
      build-directory: platform
      build-script: build
      docker-file: platform/Dockerfile
      docker-target: platform-ui
      docker-image: platform-ui
      upload-artifact: true

  playwright:
    name: Playwright
    needs:
      - platform-ui-image
    uses: ./.github/workflows/playwright.yml
    strategy:
      fail-fast: false
      matrix:
        project: 
          - "mock chromium"
          - "mock firefox"
          - "mock webkit"
    with:
      PROJECT: ${{ matrix.project }}
    