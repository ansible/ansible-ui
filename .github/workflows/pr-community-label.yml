name: Community PR Label

on:
  workflow_run:
    workflows:
      - PR Checks
    types:
      - completed

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  label-community:
    name: Label Community PRs
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.repository == 'ansible/ansible-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Download PR number artifact
        uses: actions/download-artifact@v4
        with:
          name: pr_number
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract PR number
        id: pr
        run: echo "number=$(head -n1 pr_number.txt | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Add community label for fork PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          JSON=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRepositoryOwner,baseRepository,isCrossRepository)
          IS_CROSS=$(echo "$JSON" | jq -r '.isCrossRepository')
          if [ "$IS_CROSS" != "true" ]; then
            echo "Not a fork PR — skipping community label."
            exit 0
          fi

          HAS_LABEL=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | index("community") != null')
          if [ "$HAS_LABEL" = "true" ]; then
            echo "PR #$PR_NUMBER already has community label."
            exit 0
          fi

          gh label create "community" --repo "$REPO" --color "7057FF" --description "Community contribution from fork" --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "community"
          HEAD=$(echo "$JSON" | jq -r '.headRepositoryOwner.login // "fork"')
          echo "Labeled PR #$PR_NUMBER as community (from fork: $HEAD)"