name: Ephemeral AAP Playwright

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  statuses: write

jobs:
  check-comment:
    name: Check Comment Trigger
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/run-aap-ui-playwright')
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.check.outputs.triggered }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}
      pr_ref: ${{ steps.pr.outputs.ref }}
      aap_version: ${{ steps.pr.outputs.aap_version }}
    steps:
      - name: Check trigger comment
        id: check
        run: echo "triggered=true" >> $GITHUB_OUTPUT

      - name: Get PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('number', pr.data.number);
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('ref', pr.data.head.ref);

            // Parse AAP version from comment (e.g., "/run-aap-ui-playwright 2.5-next")
            const commentBody = context.payload.comment.body;
            const versionMatch = commentBody.match(/\/run-aap-ui-playwright\s+(\S+)/);
            const aapVersion = versionMatch ? versionMatch[1] : '2.6';
            core.setOutput('aap_version', aapVersion);

      - name: Add reaction to comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Report pending status to PR
        uses: actions/github-script@v7
        with:
          script: |
            const prSha = '${{ steps.pr.outputs.sha }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: prSha,
              state: 'pending',
              context: 'Ephemeral AAP Playwright',
              description: 'Tests in progress...',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Post starting message
        uses: actions/github-script@v7
        with:
          script: |
            const aapVersion = '${{ steps.pr.outputs.aap_version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Starting AAP Playwright E2E tests with aap-dev deployment...\n\n**AAP Version**: ${aapVersion}\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            });

  matrix-setup:
    name: Setup Matrix
    needs: check-comment
    if: needs.check-comment.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix containers
        id: set-matrix
        run: |
          # Configure number of parallel AAP deployments/test runners
          PARALLEL_JOBS=4
          CONTAINERS=$(seq 1 $PARALLEL_JOBS | jq --slurp -c)
          echo "matrix=$CONTAINERS" >> $GITHUB_OUTPUT
          echo "Running tests across $PARALLEL_JOBS parallel AAP deployments"

  deploy-and-test:
    name: Deploy AAP (${{ matrix.container }}) and Run Playwright E2E Tests
    needs:
      - check-comment
      - matrix-setup
    if: needs.check-comment.outputs.triggered == 'true'
    runs-on: aap-dev
    outputs:
      currents_run_url: ${{ steps.playwright-tests.outputs.currents_run_url }}
    concurrency:
      group: ephemeral-aap-playwright-pr-${{ needs.check-comment.outputs.pr_number }}-${{ matrix.container }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-comment.outputs.pr_sha }}
          fetch-depth: 1

      - name: Stagger deployment start to reduce resource contention
        run: sleep $(( (${{ matrix.container }} - 1) * 45 ))

      - name: Deploy AAP using aap-dev action
        id: deploy
        uses: ansible/aap-dev/.github/actions/aap_deploy@main
        with:
          red_hat_registry_user: ${{ secrets.RED_HAT_REGISTRY_USER }}
          red_hat_registry_token: ${{ secrets.RED_HAT_REGISTRY_TOKEN }}
          aap_version: ${{ needs.check-comment.outputs.aap_version }}
          aap_dev_repo_github_token: ${{ secrets.GH_TOKEN }}
          aap_test_secrets_repo_github_token: ${{ secrets.AAP_TEST_SECRETS_REPO_GITHUB_TOKEN }}
          quay_registry_user: ${{ secrets.QUAY_AAP_DEV_USERNAME }}
          quay_registry_token: ${{ secrets.QUAY_AAP_DEV_TOKEN }}

      - name: Display AAP deployment info
        run: |
          echo "AAP URL: ${{ steps.deploy.outputs.aap_url }}"
          echo "AAP deployment successful!"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install galaxykit
        run: |
          pip3 install ansible git+https://github.com/ansible/galaxykit.git@main

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Currents for Playwright
        run: npm install @currents/playwright

      - name: Build Platform UI
        run: |
          cd platform
          npm run build

      - name: Strip trailing slash from AAP URL
        run: |
          echo "PLATFORM_SERVER=$(echo '${{ steps.deploy.outputs.aap_url }}' | sed 's:/*$::')" >> $GITHUB_ENV

      - name: Start Platform UI
        run: |
          cd platform
          PLATFORM_SERVER=${{ env.PLATFORM_SERVER }} npm start &
          sleep 15

      - name: Wait for Platform UI
        run: |
          timeout 60 bash -c 'until curl -k https://localhost:4100 > /dev/null 2>&1; do sleep 2; done' || exit 1

      - name: Run Playwright Tests with Currents
        id: playwright-tests
        working-directory: playwright
        run: |
          # Run Playwright with Currents.dev for test reporting
          # Matrix strategy: Each job runs in parallel with its own AAP instance
          # Sharding distributes tests across matrix jobs for optimal parallelization
          # Using pwc (Playwright with Currents) command for orchestration

          # Capture the output to extract the Run URL while preserving exit code
          set +e
          set -o pipefail
          npx pwc \
            --key="${CURRENTS_RECORD_KEY}" \
            --project-id="${CURRENTS_PROJECT_ID}" \
            --ci-build-id="${CURRENTS_CI_BUILD_ID}" \
            -- \
            --project="live chromium" \
            --shard=${{ matrix.container }}/4 2>&1 | tee output.log
          PWC_EXIT_CODE=$?
          set -e

          # Extract and save the Currents Run URL from output
          RUN_URL=$(grep -oP '🌐 Run URL: \K\S+' output.log | head -n 1 || echo "")

          # Validate the URL before setting output
          if [ -n "$RUN_URL" ] && [[ "$RUN_URL" =~ ^https://app\.currents\.dev/run/ ]]; then
            echo "currents_run_url=${RUN_URL}" >> $GITHUB_OUTPUT
            echo "✅ Currents Run URL: ${RUN_URL}"
          else
            echo "⚠️  Failed to extract valid Currents Run URL from output"
          fi

          # Clean up temporary file
          rm -f output.log

          # Report exit code and fail if tests failed
          if [ $PWC_EXIT_CODE -ne 0 ]; then
            echo "❌ Playwright tests failed with exit code: $PWC_EXIT_CODE"
            exit $PWC_EXIT_CODE
          else
            echo "✅ Playwright tests passed"
          fi
        env:
          PLATFORM_UI: https://localhost:4100
          PLATFORM_USERNAME: admin
          PLATFORM_PASSWORD: ${{ steps.deploy.outputs.admin_password }}
          AWX_API_PREFIX: /api/controller/v2
          CURRENTS_PROJECT_ID: ${{ secrets.CURRENTS_PROJECT_ID }}
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          CURRENTS_CI_BUILD_ID: pr-${{ needs.check-comment.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.container }}
          path: playwright/test-results
          retention-days: 7

      - name: Upload Playwright Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage-${{ matrix.container }}
          path: playwright/coverage/playwright/
          retention-days: 7

      - name: Cleanup AAP deployment
        if: always()
        uses: ansible/aap-dev/.github/actions/aap_delete@main
        with:
          kube_config: ${{ steps.deploy.outputs.kube_config }}
          aap_dev_repo_github_token: ${{ secrets.GH_TOKEN }}

  merge-coverage:
    name: Merge Coverage Reports
    needs:
      - check-comment
      - matrix-setup
      - deploy-and-test
    if: always() && needs.check-comment.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-comment.outputs.pr_sha }}
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download all Playwright coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-coverage-*
          path: playwright-coverage-artifacts

      - name: Merge Playwright coverage reports
        run: |
          mkdir -p coverage/playwright-merged
          # Use nyc to merge all coverage-final.json files from each shard
          npx nyc merge playwright-coverage-artifacts coverage/playwright-merged/coverage-final.json
          # Create temp directory for nyc
          mkdir -p .nyc_output
          # Copy merged coverage to nyc temp dir
          cp coverage/playwright-merged/coverage-final.json .nyc_output/out.json
          # Generate lcov report from merged coverage
          npx nyc report --reporter=lcov --report-dir=coverage/playwright-merged

      - name: Save PR information for other workflows
        run: |
          mkdir -p pr-info
          echo "${{ needs.check-comment.outputs.pr_number }}" > pr-info/pr_number.txt
          echo "${{ needs.check-comment.outputs.pr_sha }}" > pr-info/pr_sha.txt
          echo "${{ needs.check-comment.outputs.pr_ref }}" > pr-info/pr_ref.txt

      - name: Upload PR information artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-info
          path: pr-info/
          retention-days: 7

      - name: Upload Playwright coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-coverage-merged
          path: coverage/playwright-merged/
          retention-days: 7

  report-results:
    name: Report Test Results
    needs:
      - check-comment
      - matrix-setup
      - deploy-and-test
      - merge-coverage
    if: always() && needs.check-comment.outputs.triggered == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        id: check-results
        uses: actions/github-script@v7
        with:
          script: |
            const deployAndTestResults = ${{ toJson(needs.deploy-and-test) }};

            // Check overall job result
            const jobResult = deployAndTestResults.result;
            const allSuccess = jobResult === 'success';
            const anyCancelled = jobResult === 'cancelled';
            const anyFailure = jobResult === 'failure';

            console.log('Deploy and test job result:', jobResult);
            console.log('All success:', allSuccess);
            console.log('Any cancelled:', anyCancelled);
            console.log('Any failure:', anyFailure);

            core.setOutput('all_success', allSuccess);
            core.setOutput('any_cancelled', anyCancelled);
            core.setOutput('any_failure', anyFailure);

      - name: Report success status to PR
        if: steps.check-results.outputs.all_success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prSha = '${{ needs.check-comment.outputs.pr_sha }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: prSha,
              state: 'success',
              context: 'Ephemeral AAP Playwright',
              description: 'Tests completed successfully',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Post success comment
        if: steps.check-results.outputs.all_success == 'true'
        uses: actions/github-script@v7
        env:
          CURRENTS_RUN_URL: ${{ needs.deploy-and-test.outputs.currents_run_url }}
          CURRENTS_CI_BUILD_ID: pr-${{ needs.check-comment.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const parallelJobs = ${{ needs.matrix-setup.outputs.matrix }}.length;
            const currentsRunUrl = process.env.CURRENTS_RUN_URL;
            const currentsCiBuildId = process.env.CURRENTS_CI_BUILD_ID;

            let testResultsSection = '**Test Results:**\n- 🔧 [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - GitHub Actions logs';

            // Use the captured URL if valid, otherwise provide a fallback dashboard link
            if (currentsRunUrl && currentsRunUrl.startsWith('https://app.currents.dev/run/')) {
              testResultsSection = `**Test Results:**\n- 📊 [Currents Dashboard](${currentsRunUrl}) - Detailed test analytics\n- 🔧 [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - GitHub Actions logs`;
            } else if (currentsCiBuildId) {
              // Fallback: construct URL from CI build ID
              const fallbackUrl = `https://app.currents.dev/run/${currentsCiBuildId}`;
              testResultsSection = `**Test Results:**\n- 📊 [Currents Dashboard](${fallbackUrl}) - Detailed test analytics\n- 🔧 [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - GitHub Actions logs`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.check-comment.outputs.pr_number }},
              body: `✅ AAP Playwright E2E tests completed successfully!\n\n**Parallelization**: Tests ran across ${parallelJobs} parallel AAP deployments\n\n${testResultsSection}`
            });

      - name: Report failure status to PR
        if: steps.check-results.outputs.any_failure == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prSha = '${{ needs.check-comment.outputs.pr_sha }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: prSha,
              state: 'failure',
              context: 'Ephemeral AAP Playwright',
              description: 'Tests failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Post failure comment
        if: steps.check-results.outputs.any_failure == 'true'
        uses: actions/github-script@v7
        env:
          CURRENTS_RUN_URL: ${{ needs.deploy-and-test.outputs.currents_run_url }}
          CURRENTS_CI_BUILD_ID: pr-${{ needs.check-comment.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const parallelJobs = ${{ needs.matrix-setup.outputs.matrix }}.length;
            const currentsRunUrl = process.env.CURRENTS_RUN_URL;
            const currentsCiBuildId = process.env.CURRENTS_CI_BUILD_ID;

            let debuggingSection = '**Debugging Resources:**\n- 🔧 [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - GitHub Actions logs\n- 📦 Test artifacts are available in the workflow run';

            // Use the captured URL if valid, otherwise provide a fallback dashboard link
            if (currentsRunUrl && currentsRunUrl.startsWith('https://app.currents.dev/run/')) {
              debuggingSection = `**Debugging Resources:**\n- 📊 [Currents Dashboard](${currentsRunUrl}) - Test results, screenshots, and videos\n- 🔧 [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - GitHub Actions logs\n- 📦 Test artifacts are available in the workflow run`;
            } else if (currentsCiBuildId) {
              // Fallback: construct URL from CI build ID
              const fallbackUrl = `https://app.currents.dev/run/${currentsCiBuildId}`;
              debuggingSection = `**Debugging Resources:**\n- 📊 [Currents Dashboard](${fallbackUrl}) - Test results, screenshots, and videos\n- 🔧 [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - GitHub Actions logs\n- 📦 Test artifacts are available in the workflow run`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.check-comment.outputs.pr_number }},
              body: `❌ AAP Playwright E2E tests failed.\n\n**Parallelization**: Tests ran across ${parallelJobs} parallel AAP deployments\n\n${debuggingSection}`
            });

      - name: Report cancelled status to PR
        if: steps.check-results.outputs.any_cancelled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prSha = '${{ needs.check-comment.outputs.pr_sha }}';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: prSha,
              state: 'error',
              context: 'Ephemeral AAP Playwright',
              description: 'Tests were cancelled',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Post cancelled comment
        if: steps.check-results.outputs.any_cancelled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ needs.check-comment.outputs.pr_number }},
              body: '⚠️ AAP Playwright E2E tests were cancelled.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

      - name: Fail workflow if tests failed
        if: steps.check-results.outputs.any_failure == 'true'
        run: |
          echo "Tests failed - failing the workflow"
          exit 1
