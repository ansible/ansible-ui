name: Cypress Compare

on:
  workflow_call:
    inputs:
      PLATFORM_SERVER:
        type: string
        required: true
      SKIP_JOB:
        type: boolean
        required: false
        default: false
      TAGS:
        type: string
        required: false
      PARALLEL_TESTS:
        type: string
        required: true
    secrets:
      PLATFORM_PASSWORD:
        required: true
      PLATFORM_PROJECT_ID:
        required: true
      PLATFORM_RECORD_KEY:
        required: true

jobs:
  matrix-containers:
    name: Matrix Containers
    runs-on: ubuntu-latest
    outputs:
      CONTAINERS: ${{ steps.set-matrix.outputs.CONTAINERS }}
    steps:
      - name: Matrix Containers
        id: set-matrix
        run: |
          CONTAINERS=$(seq 1 ${{ inputs.PARALLEL_TESTS }} | jq --slurp -c)
          echo "CONTAINERS: $CONTAINERS"
          echo "CONTAINERS=$CONTAINERS" >> $GITHUB_OUTPUT

  cypress-compare:
    name: Cypress Compare
    runs-on: ubuntu-latest
    needs:
      - matrix-containers
    strategy:
      fail-fast: false
      matrix: 
        containers: ${{ fromJson(needs.matrix-containers.outputs.CONTAINERS) }}
    steps:
      - name: Download container image
        if: ${{ !inputs.SKIP_JOB }}
        uses: actions/download-artifact@v4
        with:
          name: platform-ui.tar
      - name: Load container image
        if: ${{ !inputs.SKIP_JOB }}
        run: docker load --input platform-ui.tar
      - name: Checkout
        if: ${{ !inputs.SKIP_JOB }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup node
        if: ${{ !inputs.SKIP_JOB }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PreCache
        if: ${{ !inputs.SKIP_JOB }}
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        if: ${{ !inputs.SKIP_JOB }}
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
            /home/runner/.cache/Cypress
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true' && !inputs.SKIP_JOB
        run: npm ci
      - name: "Install python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install galaxykit
        run: |
          pip3 install ansible git+https://github.com/ansible/galaxykit.git@main
      - name: Strip trailing slash from PLATFORM_SERVER
        run: |
          echo "PLATFORM_SERVER=$(echo '${{ inputs.PLATFORM_SERVER }}' | sed 's:/*$::')" >> $GITHUB_ENV
      - name: Cypress
        if: ${{ !inputs.SKIP_JOB }}
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: docker run --rm -p 4100:443 -e PLATFORM_SERVER=${{ env.PLATFORM_SERVER }} platform-ui
          wait-on: 'https://localhost:4100'
          record: true
          parallel: true
          config-file: cypress.compare.config.ts
          tag: ${{ inputs.TAGS }}
        env:
          PLATFORM_SERVER: ${{ env.PLATFORM_SERVER }}
          PLATFORM_USERNAME: e2e
          PLATFORM_PASSWORD: ${{ secrets.PLATFORM_PASSWORD }}
          CYPRESS_PROJECT_ID: ${{ secrets.PLATFORM_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.PLATFORM_RECORD_KEY }}
          CYPRESS_AWX_API_PREFIX: /api/controller/v2
          CYPRESS_EDA_API_PREFIX: /api/eda/v1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          CYPRESS_LABELS: '!upstream'
