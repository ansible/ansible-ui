# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters/
#
# Dual-project sync: keep this file aligned with ansible-automation-platform/aap-ui.
# Project key and organization are set in CI via GitHub Actions variables (not here).
# See docs/dev/sonarcloud-dual-project-sync.md

sonar.sources = framework/,frontend/,platform/
sonar.tests = playwright/
# Exclude generated code, API specs, and known debug/sample data
sonar.exclusions = **/*.fixture.ts,**/*.fixture.json,**/vite.config.ts,**/interfaces/generated/**,**/interfaces/generated-from-swagger/**,**/swagger.json,**/openapi.json,**/package-lock.json,**/vitest.shared.ts
sonar.coverage.exclusions = **/*.test.ts,**/*.test.tsx,**/*.test-d.ts,**/*.spec.ts,**/*.spec.tsx,**/vitest.*.ts,**/vitest.setup.ts,**/utilityTypes.ts,**/webpack.config.cjs,**/vite.config.ts,**/interfaces/generated/**,**/interfaces/generated-from-swagger/**,**/swagger.json,**/openapi.json,**/package-lock.json,**/build.cjs,**/vitest.common.ts,**/platform/interfaces/**,**/platform/main/Platform.tsx,**/platform/**/__mocks__/**
sonar.cpd.exclusions=framework/**/*,frontend/**/*,platform/**/*

sonar.javascript.lcov.reportPaths=./coverage/combined/lcov.info,./coverage/playwright/lcov.info
sonar.typescript.lcov.reportPaths=./coverage/combined/lcov.info,./coverage/playwright/lcov.info
