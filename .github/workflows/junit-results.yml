name: Merge and upload jUnit component test results

env:
  UPSTREAM_REPOSITORY_ID: 546084283

on:
  workflow_call:
    secrets:
      PDE_ORG_RESULTS_UPLOAD_PASSWORD:

jobs:
  merge-and-upload-junit-test-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PreCache
        run: npm version 0.0.0 --no-git-tag-version
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ./node_modules
          key: modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: junit-results
          pattern: junit-results-*
          merge-multiple: true

      - run: npm install -g junit-report-merger

      - name: Merge component test results
        run: jrm junit-results/aapui-test-results.xml "junit-results/*.xml"

      - name: Upload aap-ui jUnit test reports to the unified dashboard
        if: >-
          !cancelled()
          && github.event_name == 'push'
          && env.UPSTREAM_REPOSITORY_ID == github.repository_id
          && github.ref_name == github.event.repository.default_branch
        uses: ansible/gh-action-record-test-results@58376e7785cbb37b4ca0c0638edf9db4e21fd0b6
        with:
          aggregation-server-url: ${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_URL }}
          http-auth-password: >-
            ${{ secrets.PDE_ORG_RESULTS_UPLOAD_PASSWORD }}
          http-auth-username: >-
            ${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_USER }}
          project-component-name: aap-ui
          test-result-files: junit-results/aapui-test-results.xml

      - name: Cleanup test result files
        run: rm -rf ./junit-results/
