name: PR Risk Analysis

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read
  contents: read

jobs:
  check-risk-analysis:
    name: Risk Analysis Required
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check risk level is selected
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          HIGH=$(echo "$PR_BODY" | grep -ci '\- \[x\] \*\*High\*\*' || true)
          MEDIUM=$(echo "$PR_BODY" | grep -ci '\- \[x\] \*\*Medium\*\*' || true)
          LOW=$(echo "$PR_BODY" | grep -ci '\- \[x\] \*\*Low\*\*' || true)

          TOTAL=$((HIGH + MEDIUM + LOW))

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::Risk Analysis is required. Please select a risk level (High, Medium, or Low) in the PR description under **Risk Analysis - REQUIRED**."
            exit 1
          elif [ "$TOTAL" -gt 1 ]; then
            echo "::error::Please select only **one** risk level (High, Medium, or Low)."
            exit 1
          fi

          if [ "$HIGH" -eq 1 ]; then
            echo "Risk level: HIGH"
          elif [ "$MEDIUM" -eq 1 ]; then
            echo "Risk level: MEDIUM"
          else
            echo "Risk level: LOW"
          fi