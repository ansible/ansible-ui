---
- name: Test Deprecations with Warnings Enabled
  hosts: localhost
  gather_facts: yes
  environment:
    ANSIBLE_DEPRECATION_WARNINGS: "True"

  tasks:
    - name: Show that deprecation warnings should be enabled
      debug:
        msg: "ANSIBLE_DEPRECATION_WARNINGS should be enabled"

    # Using include (deprecated since 2.8, warns in 2.16)
    - name: Use deprecated include
      include: /dev/null
      ignore_errors: yes

    # Bare variables in conditionals (deprecated)
    - name: Bare variable conditional 1
      debug:
        msg: "test"
      when: ansible_os_family == "RedHat" or ansible_os_family == "Debian"

    - name: Bare variable conditional 2
      debug:
        msg: "test"
      when: ansible_distribution == "CentOS"

    - name: Bare variable conditional 3
      debug:
        msg: "test"
      when: true

    - name: with_items loop (check if deprecated)
      debug:
        msg: "Item: {{ item }}"
      with_items:
        - one
        - two
        - three
        - four
        - five
