coverage:
  ignore:
    - "**/*.test.ts"
    - "**/*.test.tsx"
    - "**/*.spec.ts"
    - "**/*.spec.tsx"
    - "**/vitest.setup.ts"
    - "**/webpack.config.cjs"
    - "**/vite.config.ts"
    - "**/interfaces/generated/**"
    - "**/interfaces/generated-from-swagger/**"
    - "**/swagger.json"
    - "**/openapi.json"
    - "**/package-lock.json"
    # Glue hooks: thin wrappers around useBulkConfirmation/useBulkActionDialog
    # that cannot be meaningfully unit tested (vi.mock prevents line execution).
    # These are better covered by Playwright E2E tests.
    - "frontend/awx/resources/groups/hooks/useDeleteGroups.tsx"
    - "frontend/awx/resources/hosts/hooks/useDeleteHosts.tsx"
    - "frontend/awx/resources/hosts/hooks/useDisassociateHosts.tsx"
    - "frontend/awx/resources/projects/hooks/useDeleteProjects.tsx"
    - "frontend/awx/resources/projects/hooks/useCancelProjects.tsx"
    - "frontend/awx/resources/templates/hooks/useDeleteTemplates.tsx"
    - "frontend/awx/resources/templates/hooks/useCopyTemplate.tsx"
    - "frontend/awx/resources/templates/hooks/useDeleteSurvey.tsx"
    - "frontend/awx/resources/templates/hooks/useDeleteSurveyDialog.tsx"
    - "frontend/awx/resources/inventories/hooks/useDeleteInventories.tsx"
    - "frontend/awx/resources/inventories/hooks/useDeleteInventorySources.tsx"
    - "frontend/awx/resources/inventories/hooks/useCopyInventory.tsx"
    - "frontend/awx/resources/inventories/hooks/useCancelInventoryUpdate.tsx"
    - "frontend/awx/resources/sources/hooks/useDeleteSources.tsx"
    - "frontend/awx/views/jobs/hooks/useDeleteJobs.tsx"
    - "frontend/awx/views/jobs/hooks/useCancelJobs.tsx"
    - "frontend/awx/views/jobs/hooks/useDeleteHostMetrics.tsx"
    - "frontend/awx/views/schedules/hooks/useDeleteSchedules.tsx"
